<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Application Form</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <div class="container">
      <h1>Job Application Form</h1>
      <form action="#" method="post">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" required placeholder="Enter your full name">

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required placeholder="Enter your email">

        <label for="position">Position</label>
        <select id="position" name="position" required>
          <option value="">Select a position</option>
          <option>Designer</option>
          <option>Frontend Developer</option>
          <option>Backend Developer</option>
        </select>

        <fieldset class="radio-group">
          <legend>Availability</legend>
          <div class="radio-wrapper">
            <input type="radio" id="full-time" name="availability" value="full-time" checked>
            <label for="full-time">Full-Time</label>
          </div>
          <div class="radio-wrapper">
            <input type="radio" id="part-time" name="availability" value="part-time">
            <label for="part-time">Part-Time</label>
          </div>
        </fieldset>

        <label for="message">Why do you want this job?</label>
        <textarea id="message" name="message" rows="5" required placeholder="Your answer..."></textarea>

        <button type="submit">Submit Application</button>
      </form>
    </div>
  </main>
</body>
</html>
