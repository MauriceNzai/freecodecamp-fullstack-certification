<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <header class="header">
      <h1>css flexbox photo gallery</h1>
    </header>
    <div class="gallery">
      <img src="https://cdn.freecodecamp.org/curriculum/css-photo-gallery/1.jpg"
        alt="A curious orange kitten looking directly at the camera">
      <img src="https://cdn.freecodecamp.org/curriculum/css-photo-gallery/2.jpg"
        alt="A relaxed cat lying on its back with paws stretched out">
      <img src="https://cdn.freecodecamp.org/curriculum/css-photo-gallery/3.jpg"
        alt="A small kitten sitting upright on a wooden surface">
      <img src="https://cdn.freecodecamp.org/curriculum/css-photo-gallery/4.jpg"
        alt="A fluffy cat resting comfortably on a couch">
      <img src="https://cdn.freecodecamp.org/curriculum/css-photo-gallery/5.jpg"
        alt="A playful kitten reaching forward as if to grab something">
      <img src="https://cdn.freecodecamp.org/curriculum/css-photo-gallery/6.jpg"
        alt="A sleepy cat curled up and resting peacefully">
      <img src="https://cdn.freecodecamp.org/curriculum/css-photo-gallery/7.jpg"
        alt="A cat peeking out from behind an object with alert eyes">
      <img src="https://cdn.freecodecamp.org/curriculum/css-photo-gallery/8.jpg"
        alt="A kitten sitting outdoors surrounded by greenery">
      <img src="https://cdn.freecodecamp.org/curriculum/css-photo-gallery/9.jpg"
        alt="A close-up of a cat's face showing detailed whiskers and eyes">
    </div>
  </body>
</html>
